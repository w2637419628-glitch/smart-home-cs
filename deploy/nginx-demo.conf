# 演示站反向代理：密码 + 限流 + 只反代三个入口
# 放到 /etc/nginx/conf.d/smart-home-demo.conf
# 注意：limit_req_zone 必须写在 http 块里；conf.d/*.conf 正好被 include 在 http 内

# 每个 IP 每分钟最多 30 次请求，突发 10 次
limit_req_zone $binary_remote_addr zone=demo:10m rate=30r/m;

# 登录失败也限流，防爆破
limit_req_zone $binary_remote_addr zone=authguard:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # ---------- 访问密码 ----------
    # 生成：sudo apt install -y apache2-utils
    #       sudo htpasswd -c /etc/nginx/.htpasswd demo
    auth_basic           "Smart Home Demo";
    auth_basic_user_file /etc/nginx/.htpasswd;
    satisfy any;

    # ---------- 限流 ----------
    limit_req zone=demo burst=10 nodelay;
    limit_req_status 429;

    # ---------- 安全头 ----------
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    server_tokens off;

    client_max_body_size 2m;

    # ---------- 反代 ----------
    location / {
        proxy_pass         http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 真实模型一次对话可能 10~30 秒
        proxy_buffering    off;    # 便于后续接流式
    }

    # 健康检查不给外人看
    location = /api/status {
        auth_basic off;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8100/api/status;
    }

    # 顺手拦掉扫描器常打的路
    location ~ /\.(env|git) { deny all; }
}
